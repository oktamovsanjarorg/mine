name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sanjar
          POSTGRES_PASSWORD: sanjar_db_password_123
          POSTGRES_DB: sanjar_bot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest pytest-asyncio
        
    - name: Check Python Syntax & Compilation
      run: |
        python -m compileall src/ tests/
        
    - name: Lint with Ruff
      run: |
        ruff check --fix src/ || true

    - name: Run unit and integration tests
      env:
        BOT_TOKEN: 8094516394:AAGdmzdGaOX12AcM6xLaGbUPlXxtd8s35gM
        ADMIN_IDS: "[7537966029]"
        BOT_ADMIN_IDS: "[7537966029]"
        POSTGRES_USER: sanjar
        POSTGRES_PASSWORD: sanjar_db_password_123
        POSTGRES_DB: sanjar_bot_db
        POSTGRES_HOST: localhost
        REDIS_HOST: localhost
      run: |
        pytest tests/ -v
