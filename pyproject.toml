[project]
name = "sanjar-bot"
version = "1.0.0"
description = "All-in-one personal Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "greenlet>=3.0",
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "miniopy-async>=1.0",
    "google-generativeai>=0.7",
    "openai>=1.30",
    "tiktoken>=0.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=10.0",
    "qrcode[pil]>=7.4",
    "pyzbar>=0.1",
    "gtts>=2.5",
    "pytesseract>=0.3",
    "python-dateutil>=2.9",
    "babel>=2.14",
    "structlog>=24.0",
    "cryptography>=42.0",
    "weasyprint>=62.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "humanize>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "F401"]
"src/handlers/*" = ["F401", "F841"]
"src/services/*" = ["F401", "F841"]
"src/repositories/*" = ["F401", "F841"]
"src/models/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
