route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'telegram-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-alerts'

receivers:
  - name: 'telegram-alerts'
    webhook_configs:
      - url: 'http://bot:8000/webhook/alerts'
        send_resolved: true
