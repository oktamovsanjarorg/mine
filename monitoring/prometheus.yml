global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "sanjarbot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["bot:8000"]
  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis_exporter:9121"]
